id: practice_certificate
title: Справка о практике
keywords: [практика, практики, руководитель практики, организация]
fields:
  - {id: student_name,    label: ФИО студента,        kind: text,   required: true, anchors: ["ФИО", "студент"], regulation_refs: ["4.1"]}
  - {id: organization,    label: Организация,         kind: text,   required: true, anchors: ["организаци", "предприяти", "ООО", "АО"], regulation_refs: ["4.1"]}
  - {id: practice_period, label: Сроки практики,      kind: period, required: true, anchors: ["срок", "период", "проходил"], regulation_refs: ["4.1"]}
  - {id: supervisor,      label: Руководитель практики, kind: text, required: true, anchors: ["руководитель"], regulation_refs: ["4.2"]}
  - {id: grade,           label: Оценка,              kind: text,   required: true, anchors: ["оценка"], regulation_refs: ["4.2"]}
  - {id: issue_number,    label: Номер справки,       kind: number, required: true, anchors: ["№", "номер"], regulation_refs: ["4.3"]}
  - {id: issue_date,      label: Дата выдачи,         kind: date,   required: true, anchors: ["дата выдачи", "от", "выдана"], regulation_refs: ["4.3"]}
  - {id: stamp,           label: Печать,              kind: bool,   required: true, detector: stamp,     regulation_refs: ["4.3"]}
  - {id: signature,       label: Подпись,             kind: bool,   required: true, detector: signature, anchors: ["подпись"], regulation_refs: ["4.3"]}
